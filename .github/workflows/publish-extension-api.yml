# Publishes :extension-api to GitHub Packages, so finbox-extension can build
# against it without a checkout of this repo.
#
# Run it after changing the API — and after bumping `apiVersion` in
# extension-api/build.gradle.kts, since GitHub Packages refuses to overwrite a
# version that already exists.
name: Publish extension-api

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Publish
        run: ./gradlew :extension-api:publish --no-daemon
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
